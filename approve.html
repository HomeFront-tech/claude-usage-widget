<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buddy approval</title>
<!-- The approval panel (approve.lua). Long requests scroll inside the fixed-height panel. -->
<style>/*__THEME__*/</style>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: var(--text-body)/1.5 var(--font); color: var(--ink); padding: 6px; }
  /* the shadow has to fit in body's 6px padding: past it, the window's square edge cuts it into a gray box */
  .panel {
    height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--bg);
    border: 1px solid var(--edge); border-top-color: var(--accent); border-radius: var(--radius-panel); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
  }
  h1 { flex: none; margin: 0; font-size: var(--text-body); font-weight: 600; overflow-wrap: anywhere; }
  .tool { color: var(--accent-hi); font-weight: 650; }
  pre {
    flex: 1; min-height: 0; margin: 0; overflow: auto; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: var(--radius-control); background: var(--panel); color: var(--ink);
    font: 11.5px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  /* the countdown shares the buttons' row, so the request itself gets the height */
  .row { display: flex; flex: none; align-items: center; gap: 8px; }
  .left { flex: 1 1 auto; min-width: 0; color: var(--dim); font-size: var(--text-small); line-height: 1.35; }
  button { border: 1px solid var(--edge); border-radius: var(--radius-control); font: inherit; font-weight: 600;
    padding: 8px 16px; cursor: pointer; color: var(--ink); }
  #allow { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  #allow:hover { background: var(--accent-hi); }
  #allow:active { background: var(--accent-pressed); }
  #deny { background: var(--raised); }
  #deny:hover { background: var(--line); }
  #deny:active { background: var(--panel); }
</style>
</head>
<body>
<div class="panel">
  <h1>Grok's Opus run wants to: <span class="tool" id="tool"></span></h1>
  <pre id="detail"></pre>
  <div class="row">
    <span class="left" id="left"></span>
    <button id="deny">Deny</button>
    <button id="allow">Approve</button>
  </div>
</div>
<script>
const INIT = /*__INIT__*/null;
const post = (type) => window.webkit.messageHandlers.approve.postMessage({ type });
document.getElementById("tool").textContent = INIT.tool;
document.getElementById("detail").textContent = INIT.detail;
document.getElementById("allow").onclick = () => post("allow");
document.getElementById("deny").onclick = () => post("deny");
const left = document.getElementById("left");
function tick() {
  const s = Math.max(0, Math.round(INIT.deadline - Date.now() / 1000));
  left.textContent = `No answer in ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} = Deny`
    + (INIT.waiting ? ` · ${INIT.waiting} more waiting` : "");
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
