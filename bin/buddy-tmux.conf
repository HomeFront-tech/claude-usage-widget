# tmux settings for the Claude Code sessions Buddy starts (bin/buddy-task). They run on
# Buddy's own server (tmux -L claude-buddy), so your own tmux and its config are untouched.
set -g mouse on                  # scroll back with the wheel or trackpad
set -g history-limit 50000
set -g escape-time 10            # Esc reaches Claude Code at once
set -g focus-events on
set -g set-titles on             # the window title is Claude Code's, so Buddy still sees the spinner
set -g set-titles-string "#T"
set -g status-style "bg=colour173,fg=colour16"
set -g status-left " Buddy task "
set -g status-left-length 12
set -g status-right " closing this window keeps it running "
set -g status-right-length 40
set -g window-status-current-format ""
set -g window-status-format ""
