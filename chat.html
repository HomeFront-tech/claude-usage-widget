<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buddy chat</title>
<!-- The floating chat panel (chat.lua). Lua inlines the shared theme before this layout. -->
<style>/*__THEME__*/</style>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: var(--text-body)/1.5 var(--font); color: var(--ink); padding: 6px; }
  /* the shadow has to fit in body's 6px padding: past it, the window's square edge cuts it into a gray box */
  .panel {
    height: 100%; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius-panel); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45); overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line);
    background: var(--panel); flex: none; cursor: grab; user-select: none; -webkit-user-select: none;
  }
  header:active { cursor: grabbing; }
  header canvas { width: 22px; height: 18px; flex: none; image-rendering: pixelated; }
  header b { font-size: var(--text-body); font-weight: 650; }
  header span { color: var(--dim); font-size: var(--text-small); flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #live { flex: none; flex-grow: 0; display: none; padding: 1px 8px; border-radius: 999px;
    font-size: var(--text-small); font-weight: 650; color: var(--accent-ink); background: var(--rec); }
  #live.on { display: inline-block; animation: rec 1.6s ease-in-out infinite; }
  #live.hold { background: var(--dim); animation: none; }
  #close { border: 0; border-radius: var(--radius-control); background: none; color: var(--dim);
    font-size: 14px; cursor: pointer; width: 28px; height: 28px; padding: 0; flex: none; }
  #close:hover { color: var(--ink); background: var(--raised); }
  #close:active { background: var(--line); }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; flex: none; padding: 8px 12px; border-radius: var(--radius-card);
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--me); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: var(--them); border-bottom-left-radius: 4px; }
  .grok { align-self: flex-start; background: var(--grok); border-bottom-left-radius: 4px; }
  .grok::before { content: "Grok"; display: block; font-size: var(--text-small); font-weight: 600; color: var(--blue); margin-bottom: 4px; }
  .task { align-self: flex-start; background: var(--task); border-bottom-left-radius: 4px; }
  .task::before { content: attr(data-name); display: block; font-size: var(--text-small); font-weight: 600; color: var(--good); margin-bottom: 4px; }
  .note { align-self: center; flex: none; max-width: 95%; padding: 2px 4px; color: var(--dim); font-size: var(--text-small); text-align: center; }
  .tg::before { content: "Telegram"; display: block; font-size: var(--text-small); font-weight: 600; margin-bottom: 4px; }
  .error { background: var(--err); color: var(--ink); }
  .dots { align-self: flex-start; flex: none; background: var(--them); border-radius: var(--radius-card); padding: 12px; display: none; gap: 4px; }
  .dots.on { display: flex; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: b 1s infinite; }
  .dots i:nth-child(2) { animation-delay: 0.15s; } .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes b { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }
  form { display: flex; flex: none; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--panel); }
  input { flex: 1; min-width: 0; border: 1px solid var(--edge); background: var(--bg); color: var(--ink);
    border-radius: var(--radius-control); padding: 8px; font: inherit; outline: none; }
  input:focus { border-color: var(--me); }
  form.rec input { border-color: var(--rec); animation: rec 1.2s ease-in-out infinite; }
  form.busy input { border-color: var(--dim); }
  @keyframes rec { 0%, 100% { box-shadow: 0 0 0 0 var(--error-bg); } 50% { box-shadow: 0 0 0 4px transparent; } }
  button.send { flex: none; border: 1px solid transparent; border-radius: var(--radius-control); background: var(--me);
    color: var(--accent-ink); font: inherit; font-weight: 650; padding: 0 12px; cursor: pointer; }
  button.send:hover { background: var(--accent-hi); }
  button.send:active { background: var(--accent-pressed); }
  .hint { flex: none; color: var(--dim); font-size: var(--text-small); line-height: 1.5; text-align: center; padding: 4px 0; }
  /* resize zones: the window's outer 8px (body's padding plus the panel's border); the cursor says which way */
  .rz { position: fixed; z-index: 5; }
  .rz.n, .rz.s { left: 12px; right: 12px; height: 8px; cursor: ns-resize; }
  .rz.e, .rz.w { top: 12px; bottom: 12px; width: 8px; cursor: ew-resize; }
  .rz.n { top: 0; } .rz.s { bottom: 0; } .rz.e { right: 0; } .rz.w { left: 0; }
  .rz.ne, .rz.nw, .rz.se, .rz.sw { width: 12px; height: 12px; }
  .rz.ne { top: 0; right: 0; cursor: nesw-resize; } .rz.sw { bottom: 0; left: 0; cursor: nesw-resize; }
  .rz.nw { top: 0; left: 0; cursor: nwse-resize; } .rz.se { bottom: 0; right: 0; cursor: nwse-resize; }
</style>
</head>
<body>
<div class="panel">
  <header>
    <canvas id="face" width="14" height="12"></canvas>
    <b>Buddy</b>
    <span id="sub"></span>
    <span id="live"></span>
    <button id="close" title="Close (Esc)">✕</button>
  </header>
  <div id="log">
    <div class="hint" id="hint">I can see the window you were in. Say anything.</div>
  </div>
  <form id="form">
    <input id="text" placeholder="Talk to me…" autocomplete="off">
    <button class="send" type="submit">Send</button>
  </form>
</div>
<div class="rz n" data-edge="n"></div><div class="rz s" data-edge="s"></div>
<div class="rz e" data-edge="e"></div><div class="rz w" data-edge="w"></div>
<div class="rz ne" data-edge="ne"></div><div class="rz nw" data-edge="nw"></div>
<div class="rz se" data-edge="se"></div><div class="rz sw" data-edge="sw"></div>
<script>
const INIT = /*__INIT__*/null || { title: "Preview", history: [], thinking: false, dictation: true };
const $ = (id) => document.getElementById(id);
const post = (msg) => { try { window.webkit.messageHandlers.buddy.postMessage(msg); } catch (e) { console.log(msg); } };
const log = $("log");
const dots = document.createElement("div");
dots.className = "dots";
dots.innerHTML = "<i></i><i></i><i></i>";

$("sub").textContent = INIT.title ? "watching " + INIT.title : "";

function note(text) {
  const d = document.createElement("div");
  d.className = "hint";
  d.textContent = text;
  log.insertBefore(d, dots);
  log.scrollTop = log.scrollHeight;
}
// After a long gap, a small timestamp says when the next line was said.
let lastAt = 0;
function stamp(at) {
  if (at - lastAt > 30 * 60) {
    const d = new Date(at * 1000);
    const day = d.toDateString() === new Date().toDateString() ? "" : d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) + ", ";
    note(day + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
  }
  lastAt = at;
}
// m.said: a line from its speech bubble, which doesn't answer anything you're waiting on
function add(m) {
  stamp(m.at || Date.now() / 1000);
  const d = document.createElement("div");
  d.className = (m.role === "note" ? "note" : "msg " + m.role) + (m.error ? " error" : "") + (m.via === "telegram" && m.role !== "note" ? " tg" : "");
  d.textContent = m.content;
  if (m.role === "task") d.dataset.name = "Claude Code · " + (m.name || "session");
  log.insertBefore(d, dots);
  if (!m.said && m.role !== "note") thinking(false);
  log.scrollTop = log.scrollHeight;
}
function thinking(on) {
  dots.classList.toggle("on", !!on);
  log.scrollTop = log.scrollHeight;
}
window.add = add;
window.thinking = thinking;

log.appendChild(dots);
for (const m of INIT.history || []) add(m);
thinking(INIT.thinking);

// Hold space to talk, like Claude Code's voice mode; a quick tap still types a space.
const input = $("text"), form = $("form"), PLACEHOLDER = input.placeholder, HOLD_MS = 280;
let holdTimer = null, mic = "off"; // off | rec | busy
if (INIT.dictation) $("hint").textContent += " Hold space to talk.";
function typeSpace() { input.setRangeText(" ", input.selectionStart, input.selectionEnd, "end"); }
// live voice chat (null | "live" | "hold"): "okay Buddy" opened it and it stays open until you say you're done
let live = null;
function idleHint() {
  return live === "live" ? "Live: just talk. Say “we're done” when you're finished."
    : live === "hold" ? "Paused while another app uses the microphone" : PLACEHOLDER;
}
function setLive(state) {
  live = state;
  $("live").className = state || "";
  $("live").textContent = state === "hold" ? "Paused" : "● Live";
  if (mic === "off") input.placeholder = idleHint();
}
function setMic(state) {
  mic = state;
  form.className = state === "off" ? "" : state;
  input.placeholder = state === "rec" ? "Listening… let go when you're done" : state === "busy" ? "Writing that down…" : idleHint();
}
if (INIT.live) setLive(INIT.live); // "okay Buddy" opened the panel: its "live" came before the page did
function stopListening() { setMic("busy"); post({ type: "stop" }); }
input.addEventListener("keydown", (e) => {
  if (!INIT.dictation) return;
  if (holdTimer && e.code !== "Space") { clearTimeout(holdTimer); holdTimer = null; typeSpace(); } // typing fast: it was a space
  if (e.code !== "Space" || e.metaKey || e.ctrlKey || e.altKey || e.isComposing || mic === "busy") return;
  e.preventDefault();
  if (e.repeat || holdTimer || mic === "rec") return;
  holdTimer = setTimeout(() => { holdTimer = null; setMic("rec"); post({ type: "listen" }); }, HOLD_MS);
});
input.addEventListener("keyup", (e) => {
  if (e.code !== "Space") return;
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; typeSpace(); }
  else if (mic === "rec") stopListening();
});
window.addEventListener("blur", () => { if (mic === "rec") stopListening(); });
// "okay Buddy": the spoken words go after anything you'd typed (voiceFrom: where they start).
// "send" posts the whole box as a message said out loud.
let voiceFrom = null;
window.voice = (v) => {
  const clearWords = () => {
    if (voiceFrom !== null) input.value = input.value.slice(0, voiceFrom).replace(/\s+$/, "");
    voiceFrom = null;
  };
  if (v.state === "live" || v.state === "hold" || v.state === "liveoff") {
    clearWords();
    setLive(v.state === "liveoff" ? null : v.state);
    return setMic("off");
  }
  if (v.state === "off") {
    clearWords();
    return setMic("off");
  }
  if (voiceFrom === null) {
    if (input.value && !/\s$/.test(input.value)) input.value += " ";
    voiceFrom = input.value.length;
  }
  input.value = input.value.slice(0, voiceFrom) + (v.text || "");
  if (v.state === "listening") {
    setMic("rec");
    input.placeholder = "Listening… just stop talking when you're done";
    return;
  }
  voiceFrom = null;
  setMic("off");
  const text = input.value.trim();
  if (!text) return;
  add({ role: "user", content: text });
  thinking(true);
  post({ type: "send", text, voice: true });
  input.value = "";
};
window.heard = (r) => {
  setMic("off");
  if (r && r.text) {
    const before = input.value.slice(0, input.selectionStart);
    input.setRangeText((before && !/\s$/.test(before) ? " " : "") + r.text, input.selectionStart, input.selectionEnd, "end");
  } else if (r && r.error) note(r.error);
  input.focus();
};

form.onsubmit = (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  add({ role: "user", content: text });
  thinking(true);
  post({ type: "send", text });
  $("text").value = "";
};
$("close").onclick = () => post({ type: "close" });
// Drag the panel by its header; Hammerspoon moves the window. preventDefault keeps the text box focused.
document.querySelector("header").addEventListener("mousedown", (e) => {
  if (e.button !== 0 || e.target.closest("#close")) return;
  e.preventDefault();
  post({ type: "drag" });
});
// Resize from any edge or corner the same way: Hammerspoon changes the window's frame and remembers the size.
for (const z of document.querySelectorAll(".rz")) z.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  post({ type: "resize", edge: z.dataset.edge });
});
// The newest line stays in view while the panel changes size, unless you'd scrolled up to read.
let stuck = true;
log.addEventListener("scroll", () => { stuck = log.scrollHeight - log.scrollTop - log.clientHeight < 40; });
window.addEventListener("resize", () => { if (stuck) log.scrollTop = log.scrollHeight; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") post({ type: "close" }); });
setTimeout(() => $("text").focus(), 60);

// a tiny version of the buddy in the header
const fx = $("face").getContext("2d");
const px = (x, y, w, h, c) => { fx.fillStyle = c; fx.fillRect(x, y, w, h); };
px(1, 0, 12, 10, "#d97757"); px(0, 1, 1, 8, "#d97757"); px(13, 1, 1, 8, "#d97757");
px(1, 9, 12, 1, "#b35c42"); px(3, 3, 2, 3, "#1a1414"); px(9, 3, 2, 3, "#1a1414");
px(2, 10, 1, 2, "#b35c42"); px(4, 10, 1, 2, "#b35c42"); px(9, 10, 1, 2, "#b35c42"); px(11, 10, 1, 2, "#b35c42");
</script>
</body>
</html>
