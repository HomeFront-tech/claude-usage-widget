<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: rgba(28, 27, 31, 0.96); --line: rgba(255, 255, 255, 0.08); --ink: #f2efe9; --dim: #a7a29a;
    --me: #d97757; --them: #3a383e; --err: #6b3030; --rec: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: var(--ink); padding: 6px; }
  .panel {
    height: 100%; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; border-bottom: 1px solid var(--line);
    cursor: grab; user-select: none; -webkit-user-select: none;
  }
  header:active { cursor: grabbing; }
  header canvas { width: 22px; height: 18px; image-rendering: pixelated; }
  header b { font-size: 13px; }
  header span { color: var(--dim); font-size: 11px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #close { border: 0; background: none; color: var(--dim); font-size: 15px; cursor: pointer; padding: 0 2px; }
  #close:hover { color: var(--ink); }
  #log { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 85%; padding: 7px 10px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: var(--them); border-bottom-left-radius: 4px; }
  .error { background: var(--err); }
  .dots { align-self: flex-start; background: var(--them); border-radius: 14px; padding: 9px 12px; display: none; gap: 4px; }
  .dots.on { display: flex; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: b 1s infinite; }
  .dots i:nth-child(2) { animation-delay: 0.15s; } .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes b { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }
  form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
  input {
    flex: 1; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--ink);
    border-radius: 10px; padding: 8px 10px; font: inherit; outline: none;
  }
  input:focus { border-color: var(--me); }
  form.rec input { border-color: var(--rec); animation: rec 1.2s ease-in-out infinite; }
  form.busy input { border-color: var(--dim); }
  @keyframes rec { 0%, 100% { box-shadow: 0 0 0 0 rgba(229, 72, 77, 0.45); } 50% { box-shadow: 0 0 0 4px rgba(229, 72, 77, 0); } }
  button.send { border: 0; border-radius: 10px; background: var(--me); color: #fff; font: inherit; font-weight: 600; padding: 0 12px; cursor: pointer; }
  .hint { color: var(--dim); font-size: 11px; text-align: center; padding: 2px 0 4px; }
</style>
</head>
<body>
<div class="panel">
  <header>
    <canvas id="face" width="14" height="12"></canvas>
    <b>Buddy</b>
    <span id="sub"></span>
    <button id="close" title="Close (Esc)">✕</button>
  </header>
  <div id="log">
    <div class="hint" id="hint">I can see the window you were in. Say anything.</div>
  </div>
  <form id="form">
    <input id="text" placeholder="Talk to me…" autocomplete="off">
    <button class="send" type="submit">Send</button>
  </form>
</div>
<script>
const INIT = /*__INIT__*/null || { title: "Preview", history: [], thinking: false, dictation: true };
const $ = (id) => document.getElementById(id);
const post = (msg) => { try { window.webkit.messageHandlers.buddy.postMessage(msg); } catch (e) { console.log(msg); } };
const log = $("log");
const dots = document.createElement("div");
dots.className = "dots";
dots.innerHTML = "<i></i><i></i><i></i>";

$("sub").textContent = INIT.title ? "watching " + INIT.title : "";

function note(text) {
  const d = document.createElement("div");
  d.className = "hint";
  d.textContent = text;
  log.insertBefore(d, dots);
  log.scrollTop = log.scrollHeight;
}
// After a long gap, a small timestamp says when the next line was said.
let lastAt = 0;
function stamp(at) {
  if (at - lastAt > 30 * 60) {
    const d = new Date(at * 1000);
    const day = d.toDateString() === new Date().toDateString() ? "" : d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) + ", ";
    note(day + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
  }
  lastAt = at;
}
// m.said: a line from its speech bubble, which doesn't answer anything you're waiting on
function add(m) {
  stamp(m.at || Date.now() / 1000);
  const d = document.createElement("div");
  d.className = "msg " + m.role + (m.error ? " error" : "");
  d.textContent = m.content;
  log.insertBefore(d, dots);
  if (!m.said) thinking(false);
  log.scrollTop = log.scrollHeight;
}
function thinking(on) {
  dots.classList.toggle("on", !!on);
  log.scrollTop = log.scrollHeight;
}
window.add = add;
window.thinking = thinking;

log.appendChild(dots);
for (const m of INIT.history || []) add(m);
thinking(INIT.thinking);

// Hold space to talk, like Claude Code's voice mode; a quick tap still types a space.
const input = $("text"), form = $("form"), PLACEHOLDER = input.placeholder, HOLD_MS = 280;
let holdTimer = null, mic = "off"; // off | rec | busy
if (INIT.dictation) $("hint").textContent += " Hold space to talk.";
function typeSpace() { input.setRangeText(" ", input.selectionStart, input.selectionEnd, "end"); }
function setMic(state) {
  mic = state;
  form.className = state === "off" ? "" : state;
  input.placeholder = state === "rec" ? "Listening… let go when you're done" : state === "busy" ? "Writing that down…" : PLACEHOLDER;
}
function stopListening() { setMic("busy"); post({ type: "stop" }); }
input.addEventListener("keydown", (e) => {
  if (!INIT.dictation) return;
  if (holdTimer && e.code !== "Space") { clearTimeout(holdTimer); holdTimer = null; typeSpace(); } // typing fast: it was a space
  if (e.code !== "Space" || e.metaKey || e.ctrlKey || e.altKey || e.isComposing || mic === "busy") return;
  e.preventDefault();
  if (e.repeat || holdTimer || mic === "rec") return;
  holdTimer = setTimeout(() => { holdTimer = null; setMic("rec"); post({ type: "listen" }); }, HOLD_MS);
});
input.addEventListener("keyup", (e) => {
  if (e.code !== "Space") return;
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; typeSpace(); }
  else if (mic === "rec") stopListening();
});
window.addEventListener("blur", () => { if (mic === "rec") stopListening(); });
window.heard = (r) => {
  setMic("off");
  if (r && r.text) {
    const before = input.value.slice(0, input.selectionStart);
    input.setRangeText((before && !/\s$/.test(before) ? " " : "") + r.text, input.selectionStart, input.selectionEnd, "end");
  } else if (r && r.error) note(r.error);
  input.focus();
};

form.onsubmit = (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  add({ role: "user", content: text });
  thinking(true);
  post({ type: "send", text });
  $("text").value = "";
};
$("close").onclick = () => post({ type: "close" });
// Drag the panel by its header; Hammerspoon moves the window. preventDefault keeps the text box focused.
document.querySelector("header").addEventListener("mousedown", (e) => {
  if (e.button !== 0 || e.target.closest("#close")) return;
  e.preventDefault();
  post({ type: "drag" });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") post({ type: "close" }); });
setTimeout(() => $("text").focus(), 60);

// a tiny version of the buddy in the header
const fx = $("face").getContext("2d");
const px = (x, y, w, h, c) => { fx.fillStyle = c; fx.fillRect(x, y, w, h); };
px(1, 0, 12, 10, "#d97757"); px(0, 1, 1, 8, "#d97757"); px(13, 1, 1, 8, "#d97757");
px(1, 9, 12, 1, "#b35c42"); px(3, 3, 2, 3, "#1a1414"); px(9, 3, 2, 3, "#1a1414");
px(2, 10, 1, 2, "#b35c42"); px(4, 10, 1, 2, "#b35c42"); px(9, 10, 1, 2, "#b35c42"); px(11, 10, 1, 2, "#b35c42");
</script>
</body>
</html>
