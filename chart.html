<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Usage</title>
<!-- Shared theme is inlined by chart.lua, including the canvas series colours. -->
<style>/*__THEME__*/</style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font: var(--text-body)/1.5 var(--font);
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  main { display: flex; flex-direction: column; height: 100vh; overflow: auto; }
  .top { display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px; flex-wrap: wrap; }
  .ticker { font-weight: 700; letter-spacing: .08em; font-size: var(--text-small); background: var(--accent-soft); color: var(--accent-hi); padding: 6px 8px; border-radius: var(--radius-control); }
  .tabs { display: flex; flex-wrap: wrap; max-width: 100%; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .tabs button { font: inherit; font-weight: 600; font-size: 12px; color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .tabs button:hover { background: var(--raised); color: var(--ink); }
  .tabs button:active { background: var(--line); }
  .tabs button.on { background: var(--raised); color: var(--ink); box-shadow: var(--shadow-small); }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tabs.view button { font-size: 12.5px; }
  .spacer { flex: 1; }
  .quote { display: flex; align-items: baseline; gap: 12px; padding: 4px 16px 0; flex-wrap: wrap; }
  .price { font-size: 32px; font-weight: 650; letter-spacing: -.02em; }
  .price small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .chg { font-size: 15px; font-weight: 650; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); } .chg.flat, .chg.plain { color: var(--muted); }
  .since { color: var(--muted); font-size: 12px; }
  .stats { display: flex; gap: 12px 24px; padding: 12px 16px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .stat span { display: block; color: var(--muted); font-size: var(--text-small); text-transform: uppercase; letter-spacing: .06em; }
  .stat b { font-size: 13px; font-weight: 600; }
  .stat b.warn { color: var(--down); }
  .wrap { position: relative; flex: 1; min-height: 200px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .legend { position: absolute; left: 16px; top: 8px; right: 80px; font-size: 12px; color: var(--muted); pointer-events: none; white-space: nowrap; overflow: hidden; }
  .legend b { font-weight: 600; margin-right: 10px; color: var(--ink); }
  .legend b.up { color: var(--up); } .legend b.down { color: var(--down); }
  .legend .ma { color: var(--ma); }
  .legend .key { display: inline-flex; align-items: center; gap: 5px; margin-right: 14px; color: var(--ink); }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--edge); border-radius: var(--radius-control); padding: 8px 12px; font-size: 12px; box-shadow: var(--shadow); min-width: 170px; z-index: 2; }
  .tip .when { color: var(--muted); margin-bottom: 4px; }
  .tip .r { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .tip .r span:nth-child(2) { flex: 1; color: var(--muted); }
  .tip .r.total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; font-weight: 600; }
  .tip .r.total span:nth-child(2) { color: var(--ink); }
  .tip .note { color: var(--muted); font-size: 11px; margin-top: 4px; max-width: 230px; }
  tr.sum td { font-weight: 650; }
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; color: var(--muted); padding: 24px; pointer-events: none; }
  .empty { max-width: 540px; margin: auto; line-height: 1.6; }
  .empty strong { color: var(--ink); font-size: 15px; }
  .table { max-height: 184px; flex: none; overflow: auto; border-top: 1px solid var(--line); padding: 0 16px 8px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: right; color: var(--muted); font-weight: 600; font-size: var(--text-small); text-transform: uppercase; letter-spacing: .05em; padding: 8px; position: sticky; top: 0; background: var(--panel); z-index: 1; white-space: nowrap; }
  td { text-align: right; padding: 6px 8px; white-space: nowrap; border-top: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  td:first-child { font-weight: 600; }
  td:first-child .sw { margin-right: 8px; }
  tbody tr:hover { background: var(--raised); }
  .share { display: inline-block; width: 60px; height: 5px; border-radius: 3px; background: var(--grid); vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .share i { display: block; height: 100%; background: var(--muted); border-radius: 3px; }
  footer { display: flex; flex: none; flex-wrap: wrap; gap: 4px 12px; padding: 8px 16px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }
  @media (max-width: 700px) {
    .top { align-items: flex-start; }
    .top > .spacer { display: none; }
    .stats { gap: 8px 16px; }
    .table { max-height: 160px; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="ticker">CLAUDE</span>
    <div class="tabs view" id="views" role="tablist" aria-label="View"></div>
    <div class="tabs" id="sub" role="tablist"></div>
    <span class="spacer"></span>
    <div class="tabs" id="ranges" role="tablist" aria-label="Time range"></div>
  </div>
  <div class="quote">
    <span class="price" id="price">–</span>
    <span class="chg" id="chg"></span>
    <span class="since" id="since"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="wrap" id="wrap">
    <canvas id="cv"></canvas>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="empty" id="empty" hidden></div>
  </div>
  <div class="table" id="table" hidden></div>
  <footer><span id="foot"></span><span class="spacer"></span><span id="footR"></span></footer>
</main>

<script>
const INIT = /*__INIT__*/null || { points: [], current: {}, tokens: {}, demo: true };
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const obj = (v) => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
const post = (msg) => { try { window.webkit.messageHandlers.chart.postMessage(msg); } catch (e) {} };
const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

let current = obj(INIT.current);
let points = (INIT.points || []).filter(p => p && p.t && p.v).map(p => ({ t: p.t, v: obj(p.v), r: obj(p.r) }));
let tokHours = toHours(obj(INIT.tokens).hours);
let tokMeta = obj(INIT.tokens);
let archive = obj(tokMeta.archive);
let billing = { cur: "$", charges: [], events: [] }; // read from INIT.billing once the History code has loaded
if (INIT.demo) { points = demoPoints(); tokHours = demoTokens(); tokMeta = { updated: Date.now() / 1000 }; archive = demoArchive(); }
points.sort((a, b) => a.t - b.t);

let view = store.get("view", "tokens");
let range = store.get("range", "1D");
let series = store.get("series", "Current session");
let metric = store.get("metric", "tokens");
let hmetric = store.get("hmetric", "tokens");
const RANGES = [
  { k: "1D", span: 86400, bucket: 1800, label: "past day" },
  { k: "5D", span: 5 * 86400, bucket: 7200, label: "past 5 days" },
  { k: "1M", span: 30 * 86400, bucket: 43200, label: "past month" },
  { k: "ALL", span: 0, bucket: 0, label: "all time" },
];

function tabs(el, items, value, onPick) {
  el.textContent = "";
  for (const it of items) {
    const b = document.createElement("button");
    b.textContent = it.text; b.setAttribute("role", "tab");
    b.className = it.key === value ? "on" : "";
    b.setAttribute("aria-selected", it.key === value);
    b.onclick = () => onPick(it.key);
    el.appendChild(b);
  }
}
function setStats(list) {
  const el = $("stats"); el.textContent = "";
  for (const [k, v, w] of list) {
    const d = document.createElement("div"); d.className = "stat";
    const s = document.createElement("span"); s.textContent = k;
    const val = document.createElement("b"); val.textContent = v; if (w) val.className = "warn";
    d.append(s, val); el.appendChild(d);
  }
}
function showEmpty(title, text) {
  const box = $("empty"); box.textContent = ""; box.hidden = false;
  const head = document.createElement("strong"); head.textContent = title;
  const body = document.createElement("span"); body.textContent = text;
  box.append(head, body);
}
function canvasSize() {
  const wrap = $("wrap"), dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  return { W, H };
}
function niceStep(span, target) {
  const raw = span / target, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
}

// ---------- formatting ----------
const pct = (v, d = 1) => v == null ? "–" : v.toFixed(d).replace(/\.0+$/, "") + "%";
const pts = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1);
const clock = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const day = (t) => new Date(t * 1000).toLocaleDateString([], { month: "short", day: "numeric" });
const dayClock = (t) => new Date(t * 1000).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
function big(n) {
  if (Math.abs(n) < 999.5) return String(Math.round(n));
  const units = ["K", "M", "B", "T"];
  let v = n / 1e3, u = 0;
  while (Math.abs(v) >= 999.5 && u < units.length - 1) { v /= 1e3; u++; } // so 999,999 reads 1.0M, not 1000K
  return v.toFixed(Math.abs(v) >= 9.95 ? 0 : 1) + units[u];
}
const money = (v) => "$" + (v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(2));
function timeLabel(t, bucket) {
  const d = new Date(t * 1000);
  if (bucket >= 43200) return day(t);
  if (d.getHours() === 0 && d.getMinutes() === 0) return day(t);
  return d.toLocaleTimeString([], { hour: "numeric", minute: d.getMinutes() ? "2-digit" : undefined });
}
function untilText(t, now) {
  const s = t - now;
  if (s <= 0) return "now";
  if (s < 3600) return Math.ceil(s / 60) + " min";
  if (s < 86400) return Math.floor(s / 3600) + " hr " + Math.floor(s % 3600 / 60) + " min";
  return dayClock(t);
}

// =====================================================================
// Tokens view: Claude Code's own logs, tallied per hour by bin/claude-tokens
// =====================================================================
const METRICS = [
  { k: "tokens", text: "All tokens", unit: "tokens", split: "type" },
  { k: "output", text: "Output", unit: "output tokens", split: "model", idx: 1 },
  { k: "cost", text: "API value", unit: "at API prices", split: "model", idx: 5 },
  { k: "replies", text: "Replies", unit: "replies", split: "model", idx: 4 },
];
// Token types in categorical slot order, stacked bottom to top in this order. Cache reads
// are most of the volume, so they form the base and output sits right on top of them.
const TYPES = [{ name: "Cache read", idx: 3, slot: "--s1" }, { name: "Output", idx: 1, slot: "--s2" },
               { name: "Input", idx: 0, slot: "--s3" }, { name: "Cache write", idx: 2, slot: "--s4" }];
const SLOTS = ["--s1", "--s2", "--s3", "--s4", "--s5"];

function toHours(hours) {
  return Object.entries(obj(hours)).map(([k, h]) => ({ t: +k, m: obj(h && h.m), s: Array.isArray(h && h.s) ? h.s : [] }))
    .filter(h => h.t).sort((a, b) => a.t - b.t);
}
function modelName(id) {
  const m = /^claude-([a-z]+)-(\d+)(?:-(\d{1,2}))?(?:-\d{8})?$/.exec(id);
  if (!m) return id.replace(/^claude-/, "");
  return m[1][0].toUpperCase() + m[1].slice(1) + " " + m[2] + (m[3] ? "." + m[3] : "");
}
// Colour follows the model, not its rank in the current range: slots are handed out by
// all-time token totals, top five get a hue, the rest share "Other".
function modelSlots(list = tokHours) {
  const tot = {};
  for (const h of list) for (const [id, v] of Object.entries(h.m)) tot[id] = (tot[id] || 0) + v[0] + v[1] + v[2] + v[3];
  const order = Object.keys(tot).sort((a, b) => tot[b] - tot[a]);
  const map = {};
  order.forEach((id, i) => { map[id] = i < SLOTS.length ? { key: id, name: modelName(id), slot: SLOTS[i] } : { key: "_other", name: "Other", slot: "--other" }; });
  return { map, order };
}
// from: daily buckets from that time on, whatever the range (the History view)
function tokBuckets(now, from) {
  const R = RANGES.find(r => r.k === range) || RANGES[0];
  if (from == null && (R.k === "1D" || R.k === "5D")) {
    const size = R.k === "1D" ? 3600 : 7200, n = R.span / size;
    const last = Math.floor(now / size) * size;
    const starts = Array.from({ length: n }, (_, i) => last - (n - 1 - i) * size);
    return { starts, size, label: R.label, indexOf: (t) => { const i = Math.floor((t - starts[0]) / size); return i >= 0 && i < n ? i : -1; } };
  }
  // daily (or weekly for very long histories), on local midnights
  const midnight = (t) => { const d = new Date(t * 1000); d.setHours(0, 0, 0, 0); return d.getTime() / 1000; };
  let firstDay = midnight(from != null ? from : R.k === "1M" ? now - 29 * 86400 : (tokHours.length ? tokHours[0].t : now - 6 * 86400));
  firstDay = Math.min(firstDay, midnight(now - 6 * 86400));
  const starts = [];
  for (let d = new Date(firstDay * 1000); d.getTime() / 1000 <= now; d.setDate(d.getDate() + 1)) starts.push(d.getTime() / 1000);
  const weekly = starts.length > 180;
  if (weekly) { const w = starts.filter((_, i) => i % 7 === 0); starts.length = 0; starts.push(...w); }
  const pos = new Map(starts.map((s, i) => [s, i]));
  return { starts, size: weekly ? 7 * 86400 : 86400, label: from != null ? "all time" : R.label, daily: true,
           indexOf: (t) => { if (!weekly) return pos.get(midnight(t)) ?? -1;
                              let i = -1; for (let j = 0; j < starts.length && starts[j] <= t; j++) i = j; return i; } };
}
function metricValue(v, M) { return M.k === "tokens" ? v[0] + v[1] + v[2] + v[3] : (v[M.idx] || 0); }
function buildTokens() {
  const now = Date.now() / 1000;
  const M = METRICS.find(m => m.k === metric) || METRICS[0];
  const bk = tokBuckets(now), slots = modelSlots();
  const seriesList = M.split === "type" ? TYPES.map(t => ({ key: t.name, name: t.name, slot: t.slot }))
    : [...new Map(Object.values(slots.map).map(s => [s.key, s])).values()];
  const bars = bk.starts.map(t => ({ t, seg: {}, total: 0, sess: new Set() }));
  const byModel = {}, totals = [0, 0, 0, 0, 0, 0], sessions = new Set();
  let prevTotal = 0, firstStart = bk.starts[0], span = (bk.starts[bk.starts.length - 1] + bk.size) - firstStart;
  for (const h of tokHours) {
    if (h.t >= firstStart - span && h.t < firstStart) {
      for (const v of Object.values(h.m)) prevTotal += metricValue(v, M);
      continue;
    }
    const i = bk.indexOf(h.t);
    if (i < 0) continue;
    const b = bars[i];
    for (const [id, v] of Object.entries(h.m)) {
      if (M.split === "type") for (const ty of TYPES) b.seg[ty.name] = (b.seg[ty.name] || 0) + v[ty.idx];
      else { const key = slots.map[id] ? slots.map[id].key : "_other"; b.seg[key] = (b.seg[key] || 0) + v[M.idx]; }
      b.total += metricValue(v, M);
      for (let k = 0; k < 6; k++) totals[k] += v[k];
      const row = byModel[id] = byModel[id] || [0, 0, 0, 0, 0, 0];
      for (let k = 0; k < 6; k++) row[k] += v[k];
    }
    for (const s of h.s) { b.sess.add(s); sessions.add(s); }
  }
  return { M, bk, bars, seriesList, byModel, totals, sessions, prevTotal, slots, now, hasPrev: range !== "ALL" && tokHours.length && tokHours[0].t < firstStart };
}
function quoteTokens(T) {
  const total = T.bars.reduce((a, b) => a + b.total, 0);
  const price = $("price"); price.textContent = "";
  price.append(T.M.k === "cost" ? money(total) : big(total));
  const unit = document.createElement("small"); unit.textContent = T.M.unit; price.append(unit);
  const chg = $("chg");
  // Claude Code deletes old logs (after ~30 days), so a huge jump usually means missing
  // history rather than real growth; past 20x the comparison isn't shown.
  const ratio = T.prevTotal > 0 ? total / T.prevTotal : 0;
  if (T.hasPrev && total > 0 && ratio > 0.05 && ratio < 20) {
    const prev = T.bk.label.replace("past ", "the previous ");
    if (ratio >= 3) chg.textContent = `▲ ${ratio < 10 ? ratio.toFixed(1) : Math.round(ratio)}× ${prev}`;
    else if (ratio <= 1 / 3) chg.textContent = `▼ ${(1 / ratio).toFixed(1)}× less than ${prev}`;
    else chg.textContent = `${ratio >= 1 ? "▲" : "▼"} ${Math.abs(ratio * 100 - 100).toFixed(0)}% vs ${prev}`;
  } else chg.textContent = "";
  chg.className = "chg plain";
  $("since").textContent = T.bk.label + (T.M.split === "type" ? " · by token type" : " · by model");
  const busiest = T.bars.reduce((a, b) => b.total > a.total ? b : a, T.bars[0]);
  const fmt = (v) => T.M.k === "cost" ? money(v) : big(v);
  setStats([
    ["Input", big(T.totals[0])], ["Output", big(T.totals[1])], ["Cache write", big(T.totals[2])],
    ["Cache read", big(T.totals[3])], ["Replies", big(T.totals[4])], ["Sessions", String(T.sessions.size)],
    ["API value", money(T.totals[5])],
    ["Busiest", busiest && busiest.total ? `${T.bk.daily ? day(busiest.t) : timeLabel(busiest.t, 3600) + ", " + day(busiest.t)} · ${fmt(busiest.total)}` : "–"],
  ]);
}
let TK = null, tokHover = -1;
function drawTokens() {
  const { W, H } = canvasSize();
  const T = TK;
  const any = T.bars.some(b => b.total > 0);
  $("empty").hidden = true;
  if (!T.hist && !tokHours.length) { showEmpty("No Claude Code logs found", "This view reads the session logs Claude Code keeps in ~/.claude/projects. Use Claude Code and they'll show up here."); return; }
  if (!any && T.hist) showEmpty("No history yet", INIT.importHistory || INIT.demo
    ? "This view reads Claude Code's logs, its /stats totals and your prompt history on this Mac."
    : "Turn on older history in setup (Option-click the buddy) to bring in Claude Code's /stats totals and prompt history.");
  else if (!any) { showEmpty("Nothing in this range", "No Claude Code replies in the " + T.bk.label + ". Try a longer range."); }
  const col = (slot) => css(slot);
  const C = { grid: css("--grid"), muted: css("--muted"), bg: css("--bg"), ink: css("--ink") };
  const left = 12, axisW = 58, timeH = T.hist ? 36 : 24, top = 34; // History draws the plan strip under the bars
  const plotW = W - left - axisW, plotH = H - top - timeH - 6;
  const max = Math.max(1e-9, ...T.bars.map(b => b.total));
  const step = niceStep(max, 4), yMax = Math.ceil(max / step) * step || 1;
  const y = (v) => top + plotH - v / yMax * plotH;
  const n = T.bars.length, slot = plotW / n, bw = Math.max(1, Math.min(28, slot - 2)); // 2px gap between bars
  const fmt = (v) => T.M.k === "cost" ? (v >= 1 ? "$" + big(v) : "$" + v.toFixed(2)) : big(v);

  ctx.font = "11px -apple-system, sans-serif"; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  for (let v = 0; v <= yMax + 1e-9; v += step) {
    const yy = Math.round(y(v)) + .5;
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(left, yy); ctx.lineTo(left + plotW, yy); ctx.stroke();
    ctx.fillStyle = C.muted; ctx.fillText(fmt(v), left + plotW + 8, yy);
  }
  const every = Math.max(1, Math.ceil(80 / slot));
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  for (let i = n - 1; i >= 0; i -= every) {
    const label = T.bk.daily ? day(T.bars[i].t) : timeLabel(T.bars[i].t, T.bk.size);
    const xx = left + (i + .5) * slot;
    if (xx - ctx.measureText(label).width / 2 < 2) continue;
    ctx.fillStyle = C.muted; ctx.fillText(label, xx, H - 7);
  }
  // stacked bars: 2px surface gap between segments, rounded top
  T.bars.forEach((b, i) => {
    if (!b.total) return;
    const x = left + (i + .5) * slot - bw / 2;
    ctx.globalAlpha = (tokHover >= 0 && tokHover !== i ? .45 : 1) * (faded(T, b) ? .4 : 1);
    let base = 0;
    const segs = T.seriesList.filter(s => b.seg[s.key] > 0);
    segs.forEach((s, j) => {
      const v = b.seg[s.key], y0 = y(base), y1 = y(base + v);
      const h = y0 - y1 - (j > 0 ? 2 : 0);
      if (h > 0.4) {
        ctx.fillStyle = col(s.slot);
        ctx.beginPath();
        const r = j === segs.length - 1 ? Math.min(4, bw / 2, h) : 0;

        ctx.fill();

    const rel = open >= 1 ? ` (${d >= 0 ? "+" : "−"}${Math.abs(d / open * 100).toFixed(0)}%)` : ""; // from ~0 it's meaningless
    chg.textContent = `${d > 0 ? "▲" : d < 0 ? "▼" : "■"} ${pts(d)} pts${rel}`;
    chg.className = "chg " + (d > 0 ? "up" : d < 0 ? "down" : "flat");
  } else { chg.textContent = ""; }
  $("since").textContent = `${short(series)} · ${b.label}`;
  const hi = withData.length ? Math.max(...withData.map(c => c.h)) : null;
  const lo = withData.length ? Math.min(...withData.map(c => c.l)) : null;
  const burn = withData.reduce((a, c) => a + c.burn, 0);
  const resetAt = live ? live.resets_at : (points.length ? points[points.length - 1].r[series] : null);
  // pace: burn over the last hour (session) or day (weekly limits), projected to the reset
  const windowS = series === "Current session" ? 3600 : 86400;
  let recent = 0, prev = null;
  for (const p of points) {
    const v = p.v[series]; if (v == null) continue;
    if (p.t >= b.now - windowS && prev != null && v > prev) recent += v - prev;
    prev = v;
  }
  const perHour = recent / (windowS / 3600);
  let pace = "–", warn = false;
  if (last != null && resetAt && resetAt > b.now) {
    const hrs = (resetAt - b.now) / 3600;
    const projected = last + perHour * hrs;
    if (perHour <= 0.01) pace = "Holding steady";
    else if (projected >= 100) { pace = "100% by " + dayClock(b.now + (100 - last) / perHour * 3600); warn = true; }
    else pace = `${pct(projected, 0)} at reset`;
  }
  setStats([
    ["Open", pct(open)], ["High", pct(hi)], ["Low", pct(lo)], ["Burn", burn ? pts(burn) + " pts" : "–"],
    ["Rate", perHour ? perHour.toFixed(1) + " pts/hr" : "–"], ["At this pace", pace, warn],
    ["Resets", resetAt ? untilText(resetAt, b.now) : "–"],
  ]);
}
const cv = $("cv"), ctx = cv.getContext("2d");
let B = null, G = null, hover = null;
function draw() {
  const { W, H } = canvasSize();
  const b = B, withData = b.candles.filter(c => c.n);
  $("empty").hidden = withData.length > 1;
  if (withData.length < 2) {
    const n = points.filter(p => p.v[series] != null).length;
    showEmpty(n ? "Your chart is getting started" : "Your chart starts now",
      (n ? `${n} sample${n === 1 ? "" : "s"} so far in this range. ` : "") +
      "The card saves one every time it checks your usage (every 5 minutes while your Mac is awake), so candles fill in over the next hour. The Tokens view has your full history already.");
    $("legend").textContent = "";
    G = null; return;
  }
  const C = { grid: css("--grid"), muted: css("--muted"), up: css("--up"), down: css("--down"), cross: css("--cross"), ink: css("--ink"), bg: css("--bg"), tagInk: css("--tag-ink"), ma: css("--ma") };
  const left = 12, axisW = 58, timeH = 24, top = 34;
  const plotW = W - left - axisW, volH = Math.max(40, Math.round((H - top - timeH) * 0.2));
  const mainH = H - top - timeH - volH - 10, volTop = top + mainH + 10;
  let hi = Math.max(...withData.map(c => c.h)), lo = Math.min(...withData.map(c => c.l));
  const live = currentLimit(); if (live) { hi = Math.max(hi, live.pct); lo = Math.min(lo, live.pct); }
  const pad = Math.max((hi - lo) * 0.12, 0.6, (4 - (hi - lo)) / 2); // at least a 4-point window
  hi += pad; lo = Math.max(0, lo - pad);
  const y = (v) => top + (1 - (v - lo) / (hi - lo)) * mainH;
  const slot = plotW / b.n, bodyW = Math.max(1, Math.min(16, slot * 0.66));
  const cx = (i) => left + (i + 0.5) * slot;
  const xAt = (t) => left + (t - b.start) / b.bucket * slot;
  G = { left, plotW, top, mainH, volTop, volH, slot, y, lo, hi, cx, W, H, axisW, timeH };

  ctx.font = "11px -apple-system, sans-serif"; ctx.textBaseline = "middle";
  const step = niceStep(hi - lo, 6);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    const yy = Math.round(y(v)) + .5;
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(left, yy); ctx.lineTo(left + plotW, yy); ctx.stroke();
    ctx.fillStyle = C.muted; ctx.textAlign = "left"; ctx.fillText(pct(v, step < 1 ? 1 : 0), left + plotW + 8, yy);
  }
  const every = Math.max(1, Math.ceil(90 / slot));
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  for (let i = 0; i < b.n; i += every) {
    const xx = Math.round(left + i * slot) + .5;
    ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(xx, top); ctx.lineTo(xx, volTop + volH); ctx.stroke();
    const label = timeLabel(b.candles[i].t, b.bucket);
    if (xx - ctx.measureText(label).width / 2 < 2) continue; // would be cut off at the left edge
    ctx.fillStyle = C.muted; ctx.fillText(label, xx, H - 7);
  }
  ctx.setLineDash([2, 4]); ctx.textAlign = "left";
  for (const r of b.resets) {
    const xx = Math.round(xAt(r)) + .5;
    if (xx < left || xx > left + plotW) continue;
    ctx.strokeStyle = C.muted; ctx.globalAlpha = .5; ctx.beginPath(); ctx.moveTo(xx, top); ctx.lineTo(xx, volTop + volH); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = C.muted; ctx.font = "10px -apple-system, sans-serif"; ctx.fillText("reset", xx + 3, top + 10);
  }
  ctx.setLineDash([]);
  const maxBurn = Math.max(0.1, ...b.candles.map(c => c.burn));
  b.candles.forEach((c, i) => {
    if (!c.burn) return;
    const h = Math.max(1, c.burn / maxBurn * (volH - 4));
    ctx.fillStyle = c.c >= c.o ? C.up : C.down; ctx.globalAlpha = .35;
    ctx.fillRect(cx(i) - bodyW / 2, volTop + volH - h, bodyW, h);
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.muted; ctx.font = "10px -apple-system, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("BURN", left + 2, volTop + 2);
  b.candles.forEach((c, i) => {
    if (!c.n) return;
    const col = c.c > c.o ? C.up : c.c < c.o ? C.down : C.muted;
    ctx.fillStyle = col; ctx.strokeStyle = col;
    const xx = Math.round(cx(i)) + .5;
    ctx.beginPath(); ctx.moveTo(xx, y(c.h)); ctx.lineTo(xx, y(c.l)); ctx.lineWidth = 1; ctx.stroke();
    const yTop = y(Math.max(c.o, c.c)), yBot = y(Math.min(c.o, c.c));
    ctx.fillRect(cx(i) - bodyW / 2, yTop, bodyW, Math.max(1.5, yBot - yTop));
  });
  const ma = movingAverage(b.candles, 8);
  ctx.strokeStyle = C.ma; ctx.lineWidth = 1.5; ctx.beginPath();
  let started = false;
  ma.forEach((v, i) => { if (v == null) return; const xx = cx(i), yy = y(v); started ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); started = true; });
  ctx.stroke();
  const lastC = withData[withData.length - 1];
  const lastV = live ? live.pct : lastC.c;
  const lastCol = lastC.c > lastC.o ? C.up : lastC.c < lastC.o ? C.down : C.muted;
  const ly = Math.round(y(lastV)) + .5;
  ctx.setLineDash([4, 4]); ctx.strokeStyle = lastCol; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(left, ly); ctx.lineTo(left + plotW, ly); ctx.stroke(); ctx.setLineDash([]);
  tag(left + plotW + 2, ly, pct(lastV), lastCol, C.tagInk);
  if (hover) {
    const i = Math.max(0, Math.min(b.n - 1, Math.floor((hover.x - left) / slot)));
    const xx = Math.round(cx(i)) + .5, yy = Math.round(Math.max(top, Math.min(top + mainH, hover.y))) + .5;
    ctx.strokeStyle = C.cross; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xx, top); ctx.lineTo(xx, volTop + volH); ctx.moveTo(left, yy); ctx.lineTo(left + plotW, yy); ctx.stroke();
    ctx.setLineDash([]);
    tag(left + plotW + 2, yy, pct(lo + (1 - (yy - top) / mainH) * (hi - lo)), C.ink, C.bg);
    const tl = timeLabel(b.candles[i].t, Math.min(b.bucket, 3600)) + (b.bucket >= 43200 ? "" : " · " + day(b.candles[i].t));
    ctx.font = "11px -apple-system, sans-serif";
    const tw = ctx.measureText(tl).width + 12;
    ctx.fillStyle = C.ink; ctx.fillRect(xx - tw / 2, H - timeH + 2, tw, 18);
    ctx.fillStyle = C.bg; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(tl, xx, H - timeH + 11);
    legend(b.candles[i], ma[i]);
  } else {
    legend(lastC, ma[b.candles.indexOf(lastC)]);
  }
}
function tag(x, yy, text, bg, ink) {
  ctx.font = "600 11px -apple-system, sans-serif";
  const w = ctx.measureText(text).width + 10;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x, yy - 9, w, 18, 3); ctx.fill();
  ctx.fillStyle = ink; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(text, x + 5, yy + .5);
}
function legend(c, maV) {
  const el = $("legend"); el.textContent = "";
  if (!c || !c.n) { el.textContent = new Date(c.t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " · no data"; return; }
  const dir = c.c > c.o ? "up" : c.c < c.o ? "down" : "";
  const add = (k, v, cls) => { el.append(k + " "); const b = document.createElement("b"); b.textContent = v; if (cls) b.className = cls; el.append(b); };
  add("O", pct(c.o), dir); add("H", pct(c.h), dir); add("L", pct(c.l), dir); add("C", pct(c.c), dir);
  add("Burn", pts(c.burn), dir);
  if (maV != null) { const s = document.createElement("span"); s.className = "ma"; s.textContent = "MA8 " + pct(maV); el.append(s); }
}

// =====================================================================
// wiring
// =====================================================================
function render() {
  tabs($("views"), [{ key: "tokens", text: "Tokens" }, { key: "limits", text: "Plan limits" }, { key: "history", text: "History" }], view,
    (k) => { view = k; store.set("view", k); hover = null; tokHover = -1; render(); });
  tabs($("ranges"), RANGES.map(r => ({ key: r.k, text: r.k })), range, (k) => { range = k; store.set("range", k); render(); });
  $("ranges").hidden = view === "history"; // History always shows the whole account
  $("tip").hidden = true;
  if (view === "history") {
    tabs($("sub"), HMETRICS.map(m => ({ key: m.k, text: m.text })), hmetric, (k) => { hmetric = k; store.set("hmetric", k); render(); });
    TK = buildHistory();
    quoteHistory(TK); drawTokens(); tableHistory(TK);
    const through = archive.computed && DATE_RE.test(archive.computed) ? ` · daily stats through ${day(localDay(archive.computed))}` : "";
    $("foot").textContent = INIT.demo ? "Demo data" : !INIT.importHistory
      ? "Only Claude Code's recent logs. For older history, turn it on in setup (Option-click the buddy) or set import_history = true in config.lua"
      : `Claude Code's logs, /stats totals and prompt history on this Mac${through}`;
    $("footR").textContent = (billing.charges.length ? "Payments from billing.json" : "Add billing.json to see payments (see README)")
      + " · API value at list prices, in US$";
  } else if (view === "tokens") {
    tabs($("sub"), METRICS.map(m => ({ key: m.k, text: m.text })), metric, (k) => { metric = k; store.set("metric", k); render(); });
    TK = buildTokens();
    quoteTokens(TK); drawTokens(); tableTokens(TK);
    const upd = tokMeta.updated;
    $("foot").textContent = INIT.demo ? "Demo data" : tokHours.length
      ? `From Claude Code's logs on this Mac since ${day(tokHours[0].t)} · updated ${upd ? clock(upd) : "–"}` : "From Claude Code's logs on this Mac";
    $("footR").textContent = "API value = what these tokens cost at API list prices; plans don't charge per token";
  } else {
    const list = seriesNames();
    if (list.length && !list.includes(series)) series = list[0];
    tabs($("sub"), list.map(l => ({ key: l, text: short(l) })), series, (k) => { series = k; store.set("series", k); render(); });
    $("table").hidden = true;
    B = build(); quote(B); draw();
    const n = points.filter(p => p.v[series] != null).length;
    const firstT = points.length ? points[0].t : null;
    $("foot").textContent = INIT.demo ? "Demo data" :
      firstT ? `${n} samples since ${day(firstT)}, ${clock(firstT)} · one every 5 minutes while your Mac is awake` : "No samples yet";
    $("footR").textContent = "Green candle = usage went up · data stays on this Mac";
  }
}
function redraw() { if (view !== "limits") { if (TK) drawTokens(); } else if (G || B) draw(); }
$("wrap").addEventListener("mousemove", (e) => {
  if (view !== "limits") return tokTip(e);
  const r = cv.getBoundingClientRect(); hover = { x: e.clientX - r.left, y: e.clientY - r.top }; if (G) draw();
});
$("wrap").addEventListener("mouseleave", () => { hover = null; $("tip").hidden = true; if (tokHover !== -1) { tokHover = -1; } redraw(); });
window.addEventListener("resize", redraw);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" || (e.metaKey && e.key === "w")) post({ type: "close" }); });
window.onPoint = (p, cur) => { if (p && p.t) points.push({ t: p.t, v: obj(p.v), r: obj(p.r) }); current = obj(cur); render(); };
window.onTokens = (t) => { if (INIT.demo) return; tokMeta = obj(t); tokHours = toHours(tokMeta.hours); archive = obj(tokMeta.archive); render(); };
setInterval(render, 60000); // keep countdowns and the time axis moving
billing = normBilling(INIT.demo ? demoBilling() : obj(INIT.billing));
render();

// ---------- demo data (for screenshots, and for trying it with no history) ----------
function demoPoints() {
  const out = [], now = Math.floor(Date.now() / 1000), start = now - 7 * 86400;
  let seed = 11, week = 0, sess = 0, sessReset = 0, weekReset = start + 7 * 86400 + 4 * 3600;
  const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  for (let t = start; t <= now; t += 300) {
    const h = new Date(t * 1000).getHours();
    const busy = (h >= 8 && h < 12) || (h >= 13 && h < 18) || (h >= 20 && h < 23);
    if (t >= sessReset && sess > 0) sess = 0;
    if (busy && rnd() < 0.45) {
      if (sess === 0) sessReset = t + 5 * 3600;
      const d = rnd() * (h >= 20 ? 2.2 : 1.4);
      sess = Math.min(100, sess + d * 1.3); week = Math.min(100, week + d * 0.11);
    }
    out.push({ t, v: { "Current session": +sess.toFixed(1), "Week · all models": +week.toFixed(1), "Week · Sonnet": +(week * 0.4).toFixed(1) },
               r: { "Current session": sessReset || t + 5 * 3600, "Week · all models": weekReset, "Week · Sonnet": weekReset } });
  }
  const last = out[out.length - 1];
  current = { plan: "max", limits: [
    { label: "Current session", pct: last.v["Current session"], resets_at: last.r["Current session"] },
    { label: "Week · all models", pct: last.v["Week · all models"], resets_at: weekReset },
    { label: "Week · Sonnet", pct: last.v["Week · Sonnet"], resets_at: weekReset } ] };
  return out;
}
function demoTokens() {
  const out = [], now = Math.floor(Date.now() / 1000), start = Math.floor((now - 45 * 86400) / 3600) * 3600;
  let seed = 7;
  const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const MIX = [["claude-opus-5-5", .62, 4, 20, .2], ["claude-sonnet-5-5", .22, 2, 10, .2], ["claude-haiku-5-5", .1, .1, .5, .01], ["claude-fable-5-1", .06, 10, 50, .25]];
  for (let t = start; t <= now; t += 3600) {
    const d = new Date(t * 1000), h = d.getHours(), wd = d.getDay();
    const busy = ((h >= 8 && h < 12) || (h >= 13 && h < 18) || (h >= 20 && h < 23)) && (wd !== 0 || rnd() < .3);
    if (!busy || rnd() < .25) continue;
    const replies = Math.round(8 + rnd() * 40 * (wd === 1 ? 1.4 : 1));
    const m = {};
    for (const [id, share, pin, pout, pread] of MIX) {
      const n = Math.round(replies * share * (.6 + rnd() * .8)); if (!n) continue;
      const inp = n * 40, out_ = Math.round(n * (500 + rnd() * 900)), cw = Math.round(n * (3000 + rnd() * 5000)), cr = Math.round(n * (40000 + rnd() * 60000));
      m[id] = [inp, out_, cw, cr, n, +((inp * pin + out_ * pout + cr * pread + cw * pin * 1.25) / 1e6).toFixed(4)];
    }
    out.push({ t, m, s: Array.from({ length: 1 + Math.floor(rnd() * 3) }, (_, i) => "d" + (t / 3600 % 997) + i) });
  }
  return out;
}
// A month of daily /stats totals before the demo logs (the last ten days of it estimated),
// and prompts for every demo hour.
function demoArchive() {
  const prompts = {}, days = {};
  for (const h of tokHours) prompts[h.t] = [Math.max(1, Math.round(Object.values(h.m).reduce((a, v) => a + v[4], 0) / 6)), h.s];
  const first = tokHours.length ? tokHours[0].t : Date.now() / 1000;
  let seed = 3;
  const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const parts = (x, pin, pout, pread) => {
    const v = [Math.round(x * .002), Math.round(x * .012), Math.round(x * .07)];
    v.push(x - v[0] - v[1] - v[2], 0);
    v.push(+((v[0] * pin + v[1] * pout + v[3] * pread + v[2] * pin * 2) / 1e6).toFixed(4));
    return v;
  };
  for (let i = 1; i <= 30; i++) {
    const t = first - i * 86400, d = new Date(t * 1000);
    if (d.getDay() === 0 || rnd() < .2) continue;
    const n = Math.round(2e7 + rnd() * 6e7);
    days[d.toISOString().slice(0, 10)] = { m: { "claude-opus-5": parts(Math.round(n * .7), 5, 25, .5), "claude-sonnet-5": parts(Math.round(n * .3), 2, 10, .2) },
                                           a: [0, 0, 0], e: i > 20 ? 2 : 1 };
    prompts[Math.floor(t / 3600) * 3600] = [5 + Math.round(rnd() * 20), ["dm" + i]];
  }
  return { days, prompts, computed: new Date((first - 86400) * 1000).toISOString().slice(0, 10) };
}
// Three monthly payments with a lapse before the last one.
function demoBilling() {
  const iso = (d) => d.toISOString().slice(0, 10);
  const ago = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d; };
  const charge = (n) => { const from = ago(n), to = new Date(from); to.setMonth(to.getMonth() + 1);
                          return { date: iso(from), amount: 100, plan: "Max 5x", from: iso(from), to: iso(to) }; };
  return { currency: "$", charges: [charge(84), charge(54), charge(12)],
           events: [{ date: iso(ago(30)), text: "Cancelled" }, { date: iso(ago(12)), text: "Restarted" }] };
}
